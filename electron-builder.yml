appId: kr.school.work-dashboard
productName: 업무데스크 오르빗
copyright: © 2026 정현서

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json
  # 트레이 아이콘으로 쓰려면 앱 안에 들어 있어야 한다.
  - build/icon.png
  - '!**/*.map'

asar: true

# 앱에 넣은 글꼴의 사용 허락(SIL OFL) — 글꼴과 함께 나누어야 한다
extraResources:
  - from: src/assets/fonts/keris/OFL.txt
    to: licenses/KERIS-school-fonts-OFL.txt

# electron-updater 가 새 버전을 찾아볼 곳. 이 설정이 있어야 빌드할 때
# latest.yml 이 함께 만들어지고, 앱 안에 app-update.yml 이 들어간다.
publish:
  provider: github
  owner: sced9120
  repo: work-dashboard

win:
  icon: build/icon.ico
  # 학교 PC에서 관리자 권한 없이 설치할 수 있도록 사용자 단위로 설치한다.
  requestedExecutionLevel: asInvoker
  artifactName: WorkDashboard-Setup-${version}.${ext}
  target:
    - target: nsis
      arch: [x64]
    # 설치 프로그램 실행이 막힌 PC를 위해 실행만 하면 되는 파일도 같이 만든다.
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 업무데스크 오르빗
  installerLanguages:
    - ko-KR
  language: '1042'
  deleteAppDataOnUninstall: false

portable:
  artifactName: WorkDashboard-Portable-${version}.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]

linux:
  icon: build/icon.png
  category: Office
  target:
    - AppImage
